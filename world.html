<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a855f7">
<link rel="apple-touch-icon" href="icon-192.png">
<title>World — Vaanya's Playground</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS','Chalkboard SE',cursive,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px 90px;transition:background .5s}
.hero{text-align:center;margin-bottom:14px}
.hero .big{font-size:4rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.hero h1{font-size:clamp(1.5rem,6vw,2.3rem);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.hero p{color:#fff;opacity:.95;font-weight:bold;margin-top:2px}
.wrap{width:100%;max-width:760px}
.bar{background:rgba(255,255,255,.9);border-radius:20px;padding:12px 16px;margin-bottom:14px;box-shadow:0 5px 16px rgba(0,0,0,.12)}
.bar .t{display:flex;justify-content:space-between;font-weight:bold;color:#334155;font-size:.92rem;margin-bottom:6px}
.bar .p{height:14px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.bar .p i{display:block;height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.lesson{background:#fff;border-radius:22px;padding:16px 10px;text-align:center;text-decoration:none;display:block;
  box-shadow:0 5px 0 rgba(0,0,0,.12);border:4px solid transparent;transition:transform .18s;position:relative;
  animation:pop .45s backwards cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.lesson:hover{transform:translateY(-5px) rotate(-1.5deg);border-color:#fbbf24}
.lesson .ic{font-size:2.6rem;display:block}
.lesson .nm{font-weight:bold;color:#334155;font-size:.95rem;margin-top:5px;display:block;line-height:1.25}
.lesson .tick{position:absolute;top:8px;right:10px;font-size:1.2rem}
.lesson.locked{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:11px 16px;text-decoration:none;
  color:#7c3aed;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.12);margin-top:16px;min-height:44px}
</style>
</head>
<body>
<div class="hero">
  <div class="big" id="wEmoji">🌳</div>
  <h1 id="wName">World</h1>
  <p id="wBlurb"></p>
</div>
<div class="wrap">
  <div class="bar">
    <div class="t"><span id="pTxt">0 of 0 lessons</span><span id="pPct">0%</span></div>
    <div class="p"><i id="pFill"></i></div>
  </div>
  <div class="grid" id="grid"></div>
  <div style="text-align:center"><a class="back" href="index.html">🗺️ Back to the map</a></div>
</div>
<script src="common.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
const id = new URLSearchParams(location.search).get('w') || 'home';
const world = VP.worlds().find(w=>w.id === id) || VP.worlds()[0];
const lv = VP.unlockedLevel();

if(!world.unlocked) location.replace('index.html');

document.body.style.background = 'linear-gradient(180deg,' + world.color + ' 0%, #ffffff 78%)';
document.getElementById('wEmoji').textContent = world.emoji;
document.getElementById('wName').textContent = world.name;
document.getElementById('wBlurb').textContent = world.blurb;
document.getElementById('pTxt').textContent = world.done + ' of ' + world.lessons.length + ' lessons done';
document.getElementById('pPct').textContent = world.pct + '%';
setTimeout(()=>{
  const f = document.getElementById('pFill');
  f.style.width = world.pct + '%'; f.style.background = world.color;
}, 150);

document.getElementById('grid').innerHTML = world.lessons.map((l, i)=>{
  const locked = lv < l.min;
  const done = VP.lessonDone(world.id, l);
  const inner = '<span class="ic">' + (locked ? '🔒' : l.icon) + '</span><span class="nm">' + l.name + '</span>' +
                (done ? '<span class="tick">⭐</span>' : '') +
                (locked ? '<span class="nm" style="font-size:.75rem;color:#94a3b8">Level ' + l.min + '</span>' : '');
  const style = 'style="animation-delay:' + (i * 55) + 'ms"';
  return locked
    ? '<div class="lesson locked" ' + style + ' data-min="' + l.min + '">' + inner + '</div>'
    : '<a class="lesson" ' + style + ' href="' + l.href + '?mode=' + l.mode + '" data-i="' + i + '">' + inner + '</a>';
}).join('');

// remember which lesson was entered so core.js can tick it off when the round ends
document.querySelectorAll('a.lesson').forEach(a=>{
  a.addEventListener('click', ()=>{
    const l = world.lessons[+a.dataset.i];
    try{ sessionStorage.setItem('vp.lesson', JSON.stringify({world:world.id, lesson:l})); }catch(e){}
    playSfx('click');
  });
});
document.querySelectorAll('.lesson.locked').forEach(el=>{
  el.onclick = ()=>{ playSfx('wrong'); Mascot.say('Reach level ' + el.dataset.min + ' to open this one. Keep learning!'); };
});

setTimeout(()=>Mascot.say('Welcome to ' + world.name + '! Pick a lesson.'), 600);
</script>
<script data-goatcounter="https://vanu.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
